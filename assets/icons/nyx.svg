<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Nyx Neon Maze">
  <defs>
    <linearGradient id="nyxbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140205"/>
      <stop offset="100%" stop-color="#0A0010"/>
    </linearGradient>
    <radialGradient id="nyxglow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#2FF0FF"/>
      <stop offset="100%" stop-color="#2FF0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#nyxbg)"/>
  <!-- corredores de labirinto neon (vermelho, ato Chamber) -->
  <g stroke="#FF3355" stroke-width="6" fill="none" stroke-opacity="0.9" stroke-linecap="round">
    <path d="M32 40 H100 V72 H150"/>
    <path d="M32 90 H70 V130"/>
    <path d="M168 60 V120 H120"/>
    <path d="M50 160 H150"/>
    <path d="M110 110 V150"/>
  </g>
  <!-- pellets dourados -->
  <g fill="#FFD740">
    <circle cx="46" cy="40" r="4"/><circle cx="76" cy="40" r="4"/>
    <circle cx="150" cy="90" r="4"/><circle cx="70" cy="112" r="4"/>
    <circle cx="150" cy="160" r="4"/><circle cx="90" cy="160" r="4"/>
  </g>
  <!-- fantasma glitch (rosa) -->
  <circle cx="150" cy="45" r="12" fill="#FF3DF0"/>
  <circle cx="146" cy="43" r="2.4" fill="#fff"/><circle cx="154" cy="43" r="2.4" fill="#fff"/>
  <!-- heroi Nyx ciano com olhos -->
  <circle cx="100" cy="105" r="34" fill="url(#nyxglow)"/>
  <circle cx="100" cy="105" r="22" fill="#2FF0FF"/>
  <circle cx="92" cy="101" r="6" fill="#fff"/><circle cx="108" cy="101" r="6" fill="#fff"/>
  <circle cx="93" cy="101" r="2.6" fill="#0A0010"/><circle cx="109" cy="101" r="2.6" fill="#0A0010"/>
</svg>
